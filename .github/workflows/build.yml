name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Susun proyek Android (index.html dipakai apa adanya)
        run: |
          set -e
          test -f index.html || { echo "index.html tidak ditemukan di root repo"; exit 1; }
          mkdir -p android/app/src/main/java/com/lyricks/app android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cd android

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LyrIckS"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.lyricks.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lyricks.app"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="LyrIckS"
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/assets/hook.js <<'EOF'
          (function(){
            if (window.__lyHook) return;
            window.__lyHook = 1;
            document.addEventListener('click', function(e){
              var a = e.target && e.target.closest ? e.target.closest('a[download]') : null;
              if (!a || !/^blob:/.test(a.href)) return;
              e.preventDefault(); e.stopPropagation();
              fetch(a.href).then(function(r){ return r.blob(); }).then(function(bl){
                var name = a.download || 'file', N = 786432, i = 0;
                LyBridge.begin(name, bl.type || 'application/octet-stream');
                (function next(){
                  if (i >= bl.size) { LyBridge.end(); return; }
                  var fr = new FileReader();
                  fr.onload = function(){ LyBridge.chunk(String(fr.result).split(',')[1]); i += N; next(); };
                  fr.readAsDataURL(bl.slice(i, i + N));
                })();
              }).catch(function(err){ LyBridge.fail(String(err)); });
            }, true);
          })();
          EOF

          cat > app/src/main/java/com/lyricks/app/MainActivity.java <<'EOF'
          package com.lyricks.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.view.WindowManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private static final int REQ_FILE = 1;
              private WebView web;
              private ValueCallback<Uri[]> fileCb;
              private OutputStream out;
              private Uri outUri;
              private String hookJs = "";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  try {
                      InputStream in = getAssets().open("hook.js");
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      in.close();
                      hookJs = bo.toString("UTF-8");
                  } catch (Exception e) { }

                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  s.setAllowFileAccess(false);

                  final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();

                  web.addJavascriptInterface(new Bridge(), "LyBridge");
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                          return loader.shouldInterceptRequest(r.getUrl());
                      }
                      @Override
                      public void onPageFinished(WebView v, String url) {
                          v.evaluateJavascript(hookJs, null);
                      }
                  });
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (fileCb != null) fileCb.onReceiveValue(null);
                          fileCb = cb;
                          try {
                              startActivityForResult(p.createIntent(), REQ_FILE);
                          } catch (Exception e) {
                              fileCb = null;
                              return false;
                          }
                          return true;
                      }
                  });
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_FILE && fileCb != null) {
                      fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      fileCb = null;
                  }
              }

              private void toast(final String m) {
                  runOnUiThread(new Runnable() {
                      public void run() { Toast.makeText(MainActivity.this, m, Toast.LENGTH_LONG).show(); }
                  });
              }

              private class Bridge {
                  @JavascriptInterface
                  public synchronized void begin(String name, String mime) {
                      try {
                          boolean video = mime != null && mime.startsWith("video/");
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name);
                          v.put(MediaStore.MediaColumns.MIME_TYPE, mime);
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH,
                              (video ? Environment.DIRECTORY_MOVIES : Environment.DIRECTORY_DOWNLOADS) + "/LyrIckS");
                          v.put(MediaStore.MediaColumns.IS_PENDING, 1);
                          Uri col = video ? MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                                          : MediaStore.Downloads.EXTERNAL_CONTENT_URI;
                          outUri = getContentResolver().insert(col, v);
                          out = getContentResolver().openOutputStream(outUri);
                      } catch (Exception e) {
                          out = null;
                          toast("Gagal membuat file: " + e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public synchronized void chunk(String b64) {
                      try {
                          if (out != null) out.write(Base64.decode(b64, Base64.DEFAULT));
                      } catch (Exception e) {
                          toast("Gagal menulis file: " + e.getMessage());
                      }
                  }

                  @JavascriptInterface
                  public synchronized void end() {
                      try {
                          if (out != null) {
                              out.close();
                              ContentValues v = new ContentValues();
                              v.put(MediaStore.MediaColumns.IS_PENDING, 0);
                              getContentResolver().update(outUri, v, null, null);
                              toast("Tersimpan. Video ada di Galeri (Movies/LyrIckS), file lain di Download/LyrIckS.");
                          }
                      } catch (Exception e) {
                          toast("Gagal menyimpan: " + e.getMessage());
                      }
                      out = null;
                  }

                  @JavascriptInterface
                  public void fail(String m) { toast("Gagal: " + m); }
              }
          }
          EOF

      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Siapkan nama file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk LyrIckS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LyrIckS-APK
          path: LyrIckS.apk

      - name: Buat Release (unduh APK langsung dari HP)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" LyrIckS.apk --title "LyrIckS build ${{ github.run_number }}" --notes "APK debug, langsung bisa dipasang."
